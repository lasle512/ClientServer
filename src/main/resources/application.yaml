spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: Clothes
  datasource:
    url: jdbc:postgresql://localhost:5432/clothes
    username: postgres
    password: 1
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000, expireAfterWrite=5m
server:
  port: 8081
  servlet:
    session:
      cookie:
        same-site: none
        secure: true
app:
  storage:
    root-dir: ${STORAGE_ROOT:./storage}
  jwt:
    secret: ${JWT_TOKEN:66546A555E5A7234753778214123222A472D4B614E645262356B587032733576}
    access_token:
      duration:
        minute: 5
        second: 300
      cookie_name: access_token
    refresh_token:
      duration:
        day: 7
        second: 604800
      cookie_name: refresh_token
